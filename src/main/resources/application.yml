server:
  port: 9393
  servlet:
    context-path: /api

spring:
  application:
    name: tuku-backend
    #数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/tuku
    username: root
    password: lisuan10181018
mybatis-plus:
  configuration:
    # MyBatis 配置
    map-underscore-to-camel-case: false
    # 开发过程打印日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认值1）
      logic-not-delete-value: 0 #逻辑未删除值(默认值0)
# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: 接口文档
    version: v1.0
    group:
      default:

        api-rule: package
        api-rule-resources:
          - com.xingji.tuku.controller
